## Hyprlock configuration ---------------------------------------

$wallpaper = ~/.config/sway/wallpapers/wallpaper.jpg
$accent_color = rgba(6, 181, 239, 1.0) 
$text_color = rgba(227, 228, 229, 1.0) 
$text_color_hex = ##E3E4E5FF 
$outer_color = rgba(27, 27, 31, 0.5) 
$inner_color = rgba(27, 27, 31, 0.5) 
$check_color = rgba(72, 182, 132, 1.0) 
$fail_color = rgba(239, 98, 85, 1.0) 

#-- Background -------------------------------------------------
background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

#-- General ----------------------------------------------------
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

#-- Label : Time -----------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = $accent_color
    font_size = 120
    font_family = FiraCode Nerd Font Bold
    position = 0, -150
    halign = center
    valign = top
}

#-- Label : Day, Date Month ------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    color = $text_color
    font_size = 30
    font_family = FiraCode Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
}

#-- Label : logo -----------------------------------------------
label {
    monitor =
    text =  
    color = $text_color
    font_family = SymbolsNF
    font_size = 100
    position = 0, 0
    halign = center
    valign = center
}

#-- Label : User -----------------------------------------------
label {
    monitor =
    text = Hello, $USER
    color = $text_color
    font_size = 25
    font_family = Iosevka Nerd Font Bold
    position = 0, -120
    halign = center
    valign = center
}

#-- Input ------------------------------------------------------
input-field {
    monitor =
    size = 290, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $outer_color
    inner_color = $inner_color
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    font_color = $text_color
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    placeholder_text = <i><span foreground="$text_color_hex">Password</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

#-- Label : Current Song ---------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/sway/scripts/spotify)" 
    color = $text_color
    font_size = 16
    font_family = JetBrainsMono NF
    position = 0, 80
    halign = center
    valign = bottom
}
